name: Check QA with pkgcheck
on:
  push:

jobs:
  build:
    runs-on: alpine-tools
    steps:
      - id: QA
        shell: sh
        name: QA
        run: |
          set -eux

          GENTOO_LOCATION=/var/db/repos/gentoo
          GENTOO_RSYNC=rsync://mirrors.shork.ch/gentoo

          GURU_LOCATION=/var/db/repos/guru
          GURU_RSYNC=rsync://mirrors.shork.ch/gentoo-overlays/guru

          OVERLAY_LOCATION=/var/db/repos/melody
          OVERLAY_RSYNC=rsync://mirrors.shork.ch/gentoo-overlays/melody

          PROFILE=default/linux/amd64/23.0

          export PATH="$HOME/.local/bin:$PATH"

          rsync_cmd(){
            rsync \
              --recursive \
              --links \
              --hard-links \
              --perms \
              --times \
              --safe-links \
              --delete-delay \
              --delay-updates \
              --timeout=600 \
              --contimeout=60 \
              --no-motd \
              --bwlimit='10m' \
              --exclude='*.links.tar.gz*' \
              --exclude='/other' \
              --exclude='/distfiles' \
              --exclude='/sources' \
              "${1}" "${2}"
          }

          mkdir -p /etc/portage

          cat >/etc/portage/repos.conf <<EOF
          [DEFAULT]
          main-repo = gentoo

          [gentoo]
          location = ${GENTOO_LOCATION}

          [guru]
          location = ${GURU_LOCATION}
          masters = gentoo

          [melody]
          location = ${OVERLAY_LOCATION}
          masters = gentoo guru
          EOF

          mkdir -p /var/db/repos
          rsync_cmd "${GENTOO_RSYNC}" "${GENTOO_LOCATION}"
          rsync_cmd "${GURU_RSYNC}" "${GURU_LOCATION}"
          rsync_cmd "${OVERLAY_RSYNC}" "${OVERLAY_LOCATION}"

          ln -s "$GENTOO_LOCATION/profiles/$PROFILE" /etc/portage/make.profile

          cd "${OVERLAY_LOCATION}"
          uvx -w requests pkgcheck scan --exit error,warning,style . && echo "check successful!"

